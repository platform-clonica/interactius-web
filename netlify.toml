# ─── Build settings ──────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  # Node.js LTS — debe coincidir con la versión usada en desarrollo local.
  NODE_VERSION = "22"
  # Evita que npm audite en el install step (acelera el build).
  NPM_FLAGS    = "--no-audit --no-fund"
  # Hubspot portal/form IDs son identificadores públicos (aparecen en el HTML
  # de cualquier form embebido de Hubspot). Excluimos del secrets scanning
  # para evitar falsos positivos cuando el ID coincide con números presentes
  # en otros artefactos del repo (p.ej. el XML de migración de WordPress).
  #
  # BASIC_AUTH_USER / BASIC_AUTH_PASSWORD: el gate HTTP Basic de la landing de
  # cliente (/proyectos/bershka/future-thinking). El valor de BASIC_AUTH_USER
  # ("bershka") es parte de la propia URL de la ruta, así que aparece por todo
  # el build output → falso positivo inevitable del scanner. El password se lee
  # solo en runtime (Edge middleware), nunca se hornea en el bundle. Ambos van
  # solo en Netlify env vars; no se commitean valores reales al repo.
  SECRETS_SCAN_OMIT_KEYS = "HUBSPOT_PORTAL_ID,HUBSPOT_FORM_ID_NEWSLETTER,HUBSPOT_FORM_ID_CONTACT,HUBSPOT_FORM_ID_TESTERS,HUBSPOT_FORM_ID_BDW,BASIC_AUTH_USER,BASIC_AUTH_PASSWORD"

# ─── Next.js plugin ──────────────────────────────────────────────────────────
# Activa SSR, ISR, Image Optimization y Edge Functions de Next.js en Netlify.
# Instalado como devDependency → toma precedencia sobre el plugin de la UI.
# Si tienes el plugin activado en el dashboard de Netlify, desactívalo allí
# para evitar que se ejecute dos veces.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─── Contextos de deploy ──────────────────────────────────────────────────────
# Production (rama main)
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://www.interactius.com"

# Staging (rama staging) — pre-producción en https://staging.interactius.com
# Al no coincidir con el host canónico, SITE_CONFIG.isProduction queda false:
# robots devuelve Disallow: / y GA4 no se carga. Las HUBSPOT_FORM_ID_* están
# restringidas a scope "Production" en Netlify UI, así que en staging quedan
# undefined y los handlers entran en stub mode (logs, sin POST a HubSpot).
[context.staging.environment]
  NEXT_PUBLIC_SITE_URL = "https://staging.interactius.com"

# Deploy previews (Pull Requests)
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "https://deploy-preview-$REVIEW_ID--interactius.netlify.app"

# Branch deploys
[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "https://branch-deploy--interactius.netlify.app"

# ─── Redirects ───────────────────────────────────────────────────────────────
# Redirects para paths que NO pasan por el middleware de Next-intl porque
# tienen extensión de archivo (matcher excluye `.*\..*`). Ej: PDFs antiguos
# linkeados desde la web WP. La mayoría de redirects 301 legacy se aplican
# en `middleware.ts`; aquí solo los casos que el middleware no puede ver.
#
# Nota: el PR #20 añadió 11 reglas `status = 410` para WP-legacy puro
# (`/wp-admin/*`, `/wp-content/*`, `/author/*`, etc.) con `force = true`,
# pero NUNCA llegaron a aplicarse en producción ni staging — Netlify devolvía
# 404 normales. La causa: `@netlify/plugin-nextjs` enruta todas las requests
# al handler SSR de Next antes de evaluar los redirects custom del toml.
# Los retiramos para no tener código muerto. Google descartará las URLs WP
# vía 404 estándar (más lento que 410, pero la diferencia práctica es marginal
# para nuestro volumen). Si quisiéramos forzar 410 habría que emitirlo desde
# `middleware.ts` y/o ampliar el matcher para incluir paths con extensión.
# Solo funcionan reglas para paths CON extensión (los excluye el matcher de
# Next, así que el plugin no los reclama para SSR). Verificado en prod, mayo
# 2026: `*.pdf` 301 ✅, paths sin extensión → 404 (los reclama el SSR).
[[redirects]]
  from = "/STMDL/*"
  to = "/miradas"
  status = 301
  force = true

# Newsletters estáticas WP (`.html`) → newsletter actual.
[[redirects]]
  from = "/neuxletterdesigntapas/*"
  to = "/newsletter"
  status = 301
  force = true

# PDFs sueltos de la home WP (`/wp-content/uploads/*.pdf`). Netlify no soporta
# wildcard por sufijo, así que se listan los dos que GSC reportaba con valor.
[[redirects]]
  from = "/wp-content/uploads/ProductDiscovery.pdf"
  to = "/miradas"
  status = 301
  force = true

[[redirects]]
  from = "/wp-content/uploads/ResearchOps.pdf"
  to = "/miradas"
  status = 301
  force = true

# ─── Headers ─────────────────────────────────────────────────────────────────
# Cache-Control para assets estáticos de Next.js (ya inmutables por hash).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
